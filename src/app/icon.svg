<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5A0" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="rubyLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#C9184A" />
    </linearGradient>
    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161824" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#735316" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Sleek Squircle Container -->
  <rect x="28" y="28" width="456" height="456" rx="124" fill="url(#darkPlate)" stroke="url(#borderGlow)" stroke-width="12" />
  
  <!-- Subtle Architectural Corner Accents -->
  <path d="M 64 150 L 64 80 L 134 80" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.6" stroke-linecap="round" />
  <path d="M 448 362 L 448 432 L 378 432" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.6" stroke-linecap="round" />

  <!-- Modern Geometric "K" Monogram -->
  <g filter="url(#subtleGlow)">
    <!-- Vertical Power Spine -->
    <path d="M 148 116 C 148 108 154 102 162 102 L 194 102 C 202 102 208 108 208 116 L 208 396 C 208 404 202 410 194 410 L 162 410 C 154 410 148 404 148 396 Z" fill="url(#goldLinear)" />

    <!-- Upper Angled Wing (Chiseled Modern Beam) -->
    <path d="M 208 244 L 334 118 C 342 110 354 110 362 118 L 378 134 C 386 142 386 154 378 162 L 268 272 Z" fill="url(#goldLinear)" />

    <!-- Lower Dynamic Leg -->
    <path d="M 238 242 L 364 368 C 372 376 372 388 364 396 L 348 412 C 340 420 328 420 320 412 L 198 290 Z" fill="url(#goldLinear)" />

    <!-- Sleek Ruby Accent Core Diamond -->
    <polygon points="256,220 286,256 256,292 226,256" fill="url(#rubyLinear)" />

    <!-- Central Micro Light Pip -->
    <circle cx="256" cy="256" r="6" fill="#FFF5A0" />
  </g>
</svg>
