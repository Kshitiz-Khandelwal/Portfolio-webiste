<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="50%" stop-color="#101016" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />
  
  <!-- Subtle Inner Ring -->
  <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Center Decorative Diamond Points -->
  <path d="M 256 56 L 264 74 L 256 92 L 248 74 Z" fill="#FFD700" />
  <path d="M 256 420 L 264 438 L 256 456 L 248 438 Z" fill="#FFD700" />
  <path d="M 56 256 L 74 264 L 92 256 L 74 248 Z" fill="#FFD700" />
  <path d="M 420 256 L 438 264 L 456 256 L 438 248 Z" fill="#FFD700" />

  <!-- Traditional Ruby Red Seal Accent Diamond in Background -->
  <rect x="208" y="208" width="96" height="96" rx="20" transform="rotate(45 256 256)" fill="url(#rubyGrad)" opacity="0.85" filter="url(#glow)" />

  <!-- Stylized Geometric "K" Monogram -->
  <g fill="url(#goldGrad)">
    <!-- Vertical Spine of "K" -->
    <path d="M 148 132 C 148 124 154 118 162 118 L 194 118 C 202 118 208 124 208 132 L 208 380 C 208 388 202 394 194 394 L 162 394 C 154 394 148 388 148 380 Z" />
    
    <!-- Left Top Decorative Serif -->
    <path d="M 132 126 L 162 118 L 162 146 Z" />
    <path d="M 132 386 L 162 394 L 162 366 Z" />

    <!-- Upper Diagonal Arm of "K" -->
    <path d="M 204 266 L 318 136 C 324 129 334 125 344 125 L 366 125 C 378 125 384 139 376 148 L 256 284 Z" />

    <!-- Lower Diagonal Leg of "K" -->
    <path d="M 244 264 L 358 376 C 366 384 374 388 386 388 L 388 388 C 398 388 402 376 394 368 L 292 238 Z" />

    <!-- Central Fusion Diamond -->
    <circle cx="256" cy="256" r="14" fill="#FFF099" filter="url(#glow)" />
  </g>
</svg>
